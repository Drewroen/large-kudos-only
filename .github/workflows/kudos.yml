name: K U D O S

on:
  schedule:
    - cron: '35 14 * * *'
    - cron: '47 15 * * *'
    - cron: '2 17 * * *'
    - cron: '41 19 * * *'
    - cron: '1 21 * * *'
    - cron: '2 0 * * *'
    - cron: '13 2 * * *'
    # Monthly no-op run that commits a timestamp: pushes reset GitHub's
    # 60-day inactivity timer, which otherwise disables scheduled workflows.
    - cron: '23 3 1 * *'
  workflow_dispatch: {}

jobs:
  kudos:
    if: github.event.schedule != '23 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv run playwright install --with-deps chromium

      - name: Restore saved Strava session
        env:
          STRAVA_AUTH_STATE: ${{ secrets.STRAVA_AUTH_STATE }}
        run: echo "$STRAVA_AUTH_STATE" > auth_state.json

      - name: Run kudos bot
        env:
          HEADLESS: "true"
        run: uv run python kudos_bot.py

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: screenshots/

  keepalive:
    if: github.event.schedule == '23 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Commit keepalive timestamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
